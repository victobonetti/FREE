# Exporta a versão Windows e publica na Release "beta", para os testers baixarem. Só roda à mão
# (Actions → "Build Windows (beta)" → Run workflow): push na main publica só a web. O link fixo do download:
#   https://github.com/victobonetti/FREE/releases/download/beta/FREE-windows.zip
# A página da Release: https://github.com/victobonetti/FREE/releases/tag/beta
name: Build Windows (beta)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-beta
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Godot e do template Windows
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-windows

      - name: Baixar Godot e template Windows
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot && cd ~/godot
          curl -sSLf -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          # Do pacote de templates (1,3 GB), só o Windows 64 bits é usado.
          curl -sSLf -o t.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          unzip -j -q t.tpz templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe templates/version.txt -d "$T"
          rm t.tpz

      - name: Exportar
        run: |
          ~/godot/godot --headless --path . --import || true
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/Free.exe
          test -f build/windows/Free.exe
          cd build/windows && zip -q ../FREE-windows.zip Free.exe

      - name: Publicar na Release "beta"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Versão de teste (build do commit ${GITHUB_SHA::7}). Baixe FREE-windows.zip, descompacte e abra Free.exe. O Windows pode avisar que o app não é reconhecido: clique em 'Mais informações' e 'Executar assim mesmo'."
          if gh release view beta >/dev/null 2>&1; then
            gh release upload beta build/FREE-windows.zip --clobber
            gh release edit beta --notes "$notes"
          else
            gh release create beta build/FREE-windows.zip --title "FREE (beta, Windows)" --notes "$notes" --latest
          fi
